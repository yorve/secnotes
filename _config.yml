title: SecNotes
description: Writeups de hacking ético en español — DockerLabs, pentesting web y escalada de privilegios.
baseurl: "/secnotes"
url: "https://yorve.github.io"
theme: null
lang: es

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

logo: /ico.jpg

giscus:
  repo: "yorve/secnotes"
  repo_id: ""
  category: "General"
  category_id: ""

# Default sharing image, with existing per-article banners preserved.
defaults:
  - scope:
      path: ""
    values:
      image: /ico.jpg
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - _templates
  - REVIEW.md
  - _preview
