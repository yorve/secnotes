title: SecNotes
description: Writeups de hacking ético en español — DockerLabs, pentesting web y escalada de privilegios.
baseurl: "/secnotes"
url: "https://yorve.github.io"
theme: null
lang: es
locale: es_ES
author:
  name: Yorve CSEC
  url: https://yorve.github.io/secnotes/about
social:
  name: SecNotes
  links:
    - https://github.com/yorve
    - https://www.linkedin.com/in/yonathan-rivera-velozo/

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed

logo: /ico.jpg

giscus:
  repo: "yorve/secnotes"
  repo_id: ""
  category: "General"
  category_id: ""

# Default sharing image, with existing per-article banners preserved.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/secnotes-social.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - _templates
  - REVIEW.md
  - _preview

  - scripts
