name: Validate Jekyll
on:
  pull_request:
  push:
    branches:
      - 'improvements/**'
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --trace
      - name: Check search index and metadata
        run: ruby scripts/validate_site.rb
      - name: Save HTML for review
        uses: actions/upload-artifact@v4
        with:
          name: site-html
          path: |
            _site/**/*.html
            _site/index.html
            _site/search.json
          retention-days: 3
